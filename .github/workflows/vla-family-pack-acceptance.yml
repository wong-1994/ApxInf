name: VLA Family Pack acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  software-evidence:
    runs-on: [self-hosted, linux, arm64, thor]
    steps:
      - uses: actions/checkout@v4
      - name: Validate family schemas, fixtures, correctness, and reports
        run: >-
          python3 scripts/vla_family_pack_acceptance.py
          tests/fixtures/vla-family-pack-acceptance-v1.json
          --python python3
          --runtime-python python3
          --cargo cargo
          --output vla-family-pack-software-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: vla-family-pack-software-evidence
          path: vla-family-pack-software-report.json

  thor-bf16-evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, arm64, thor]
    steps:
      - uses: actions/checkout@v4
      - name: Execute the complete matrix on controlled hardware
        run: >-
          python3 scripts/vla_family_pack_acceptance.py
          tests/fixtures/vla-family-pack-acceptance-v1.json
          --python python3
          --runtime-python python3
          --cargo cargo
          --controlled-hardware
          --output vla-family-pack-acceptance-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: vla-family-pack-thor-bf16-evidence
          path: vla-family-pack-acceptance-report.json
